name: Release Gates CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a run be started by hand against any ref. Pushes made with an
  # automation token do not trigger workflows, so without this there is no way
  # to check a change to this file except by pushing again as a human.
  workflow_dispatch:

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Unit, Load & Recovery Tests
    runs-on: ubuntu-latest

    # The suite talks to a real PostgreSQL and Redis. Without them every test
    # module fails at import, which is how this job came to report failure on
    # every run while appearing to be a working release gate.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sidra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/sidra_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      # CI-only value. Settings requires at least 32 characters.
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev]"

      - name: Run Ruff Lint & Format Check
        run: |
          python -m ruff check apps/api
          python -m ruff format --check apps/api

      # Builds the schema the way production does. This also makes the migration
      # chain a release gate: the two migration faults that blocked a clean
      # deploy would both have failed here rather than on the server.
      - name: Apply Database Migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run Backend Unit & Integration Tests
        working-directory: apps/api
        run: pytest tests -v

      - name: Run Backend Load & Recovery Tests
        working-directory: apps/api
        run: pytest tests/load tests/recovery -v

  frontend-build-and-browser-tests:
    name: Frontend Lint, Typecheck, Build & Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint and Typecheck Web
        run: npm --workspace @intraday-sentinel/web run lint

      - name: Build Web Application
        run: npm --workspace @intraday-sentinel/web run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm --workspace @intraday-sentinel/web run test:e2e
        env:
          CI: true
