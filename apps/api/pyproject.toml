[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-sentinel-api"
version = "0.1.0"
description = "Backend for Intraday Sentinel"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "pyotp>=2.9,<3",
  "PyJWT>=2.9,<3",
  "redis>=5.0,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30,<1",
  "upstox-python-sdk>=2.23,<3",
  "websockets>=14,<16"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "psutil>=5.9.0,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1"
]

[project.scripts]
intraday-sentinel = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "SIM115"]
